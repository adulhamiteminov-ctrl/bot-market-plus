
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Market Plus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; padding: 12px; padding-bottom: 75px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .logo { font-size: 18px; font-weight: bold; color: #0088cc; }
        .main-switcher { display: flex; background: #e0e0e0; padding: 3px; border-radius: 10px; margin-bottom: 12px; }
        .switch-btn { flex: 1; padding: 9px; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .switch-btn.active { background: #fff; color: #0088cc; }
        #map { width: 100%; height: 220px; border-radius: 12px; margin-bottom: 12px; border: 2px solid #fff; }
        .search-group { display: flex; gap: 6px; margin-bottom: 12px; }
        .search-box { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .search-btn { background: #0088cc; color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; }
        .add-btn { width: 100%; background: #0088cc; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
        .categories { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .cat-card { background: #fff; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px; border: 1px solid #eee; cursor: pointer; }
        .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }
        .btn-demo { background: #e3f2fd; color: #0d47a1; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
        .close-btn { float: right; font-size: 20px; border: none; background: none; cursor: pointer; }
        .nav-tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1px solid #ddd; padding: 6px; }
        .tab { flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .tab.active { color: #0088cc; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Bot Market Plus</div>
        <div>🟢 Online</div>
    </div>

    <div class="main-switcher">
        <button class="switch-btn active" id="btnPlaces" onclick="switchSection('places')">📱 Joylar & Xizmatlar</button>
        <button class="switch-btn" id="btnBots" onclick="switchSection('bots')">🤖 Bot Ijarasi ($1.5)</button>
    </div>

    <div id="sectionPlaces">
        <button style="width:100%; background:#28a745; color:#fff; border:none; padding:10px; border-radius:8px; margin-bottom:10px; font-weight:bold;" onclick="getGPSLocation()">🎯 GPS Joylashuvim</button>
        <div id="map"></div>
        <div class="search-group">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Qidirish (Kafe, avtoservis...)" oninput="searchLocations()">
            <button class="search-btn" onclick="searchLocations()">🔍</button>
        </div>
        <button class="add-btn" onclick="openModal('addModal')">📢 O'z biznesingizni qo'shing</button>
        <div class="categories">
            <div class="cat-card" onclick="filterCat('Avtoservis')">🛠️ Avtoservis</div>
            <div class="cat-card" onclick="filterCat('Sartaroshxona')">✂️ Sartaroshxona</div>
            <div class="cat-card" onclick="filterCat('Restoran')">🍽️ Restoran / Kafe</div>
            <div class="cat-card" onclick="filterCat('Doʻkon')">🛍️ Do'konlar</div>
        </div>
        <div id="cardsContainer"></div>
    </div>

    <div id="sectionBots" style="display:none;">
        <div class="card">
            <div class="card-header">🍽️ Restoran Boti <span>$1.5/oy</span></div>
            <a href="https://t.me/bmp_kafe_demo_bot" target="_blank" class="btn-demo">▶️ Demoni sinash</a>
        </div>
        <div class="card">
            <div class="card-header">✂️ Sartaroshxona Boti <span>$1.0/oy</span></div>
            <a href="https://t.me/bmp_salon_demo_bot" target="_blank" class="btn-demo">▶️ Demoni sinash</a>
        </div>
        <div class="card">
            <div class="card-header">🛠️ Avtoservis Boti <span>$1.0/oy</span></div>
            <a href="https://t.me/bmp_avto_demo_bot" target="_blank" class="btn-demo">▶️ Demoni sinash</a>
        </div>
    </div>

    <div class="nav-tabs">
        <div class="tab active" id="tabPlaces" onclick="switchSection('places')">📱 Joylar</div>
        <div class="tab" id="tabBots" onclick="switchSection('bots')">🤖 Botlar</div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('addModal')">&times;</button>
            <h3>Biznesingizni Qo'shing</h3>
            <p style="margin-top:10px; font-size:13px;">Telegram orqali bog'laning: @admin</p>
        </div>
    </div>
