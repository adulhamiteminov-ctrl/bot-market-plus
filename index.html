
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Market Plus - Xarita</title>
    
    <!-- Leaflet CSS (Xarita uchun bepul va tezkor kutubxona) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 12px;
            padding-bottom: 70px;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #0088cc;
        }

        .online-badge {
            font-size: 11px;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* Region Selector */
        .location-container {
            margin-bottom: 8px;
        }

        .region-select {
            width: 100%;
            background: #ffffff;
            border: 1px solid #0088cc;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #0088cc;
            outline: none;
        }

        /* GPS Button */
        .gps-btn {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(40,167,69,0.2);
        }

        /* Map Container (Xarita ekrani) */
        #map {
            width: 100%;
            height: 260px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border: 2px solid #fff;
        }

        /* Search Box */
        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            background: #fff;
        }

        /* Categories Grid */
        .categories-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #555;
        }

        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .cat-card {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #eee;
            cursor: pointer;
        }

        .cat-promo {
            grid-column: span 2;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        /* Business Card */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid #eaeaea;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
        }

        .card-distance {
            font-size: 11px;
            color: #28a745;
            font-weight: bold;
            background: #e8f5e9;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .card-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .card-actions {
            display: flex;
            gap: 6px;
        }

        .btn {
            flex: 1;
            padding: 8px 4px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn-loc { background: #e3f2fd; color: #0d47a1; }
        .btn-bot { background: #0088cc; color: white; }

        /* Footer links */
        .footer-links {
            margin-top: 15px;
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #eee;
        }

        .footer-btn {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            padding: 8px 0;
            font-size: 12px;
            color: #444;
            font-weight: 500;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        /* Bottom Navigation Tabs */
        .nav-tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            border-top: 1px solid #ddd;
            padding: 6px;
            z-index: 1000;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
        }

        .tab.active {
            color: #0088cc;
            background: #e1f5fe;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">Bot Market Plus</div>
        <div class="online-badge">🟢 Online: 142</div>
    </div>

    <!-- Region Selector -->
    <div class="location-container">
        <select class="region-select" id="regionSelect">
            <option value="tashkent_city" selected>📍 Toshkent shahri</option>
            <option value="tashkent_reg">📍 Toshkent viloyati</option>
            <option value="samarkand">📍 Samarqand viloyati</option>
            <option value="bukhara">📍 Buxoro viloyati</option>
            <option value="fergana">📍 Farg'ona viloyati</option>
            <option value="namangan">📍 Namangan viloyati</option>
            <option value="andijan">📍 Andijon viloyati</option>
            <option value="qashqadaryo">📍 Qashqadaryo viloyati</option>
            <option value="surxondaryo">📍 Surxondaryo viloyati</option>
            <option value="jizzakh">📍 Jizzax viloyati</option>
            <option value="sirdaryo">📍 Sirdaryo viloyati</option>
            <option value="navoiy">📍 Navoiy viloyati</option>
            <option value="khorezm">📍 Xorazm viloyati</option>
            <option value="karakalpakstan">📍 Qoraqalpog'iston Respublikasi</option>
        </select>
    </div>

    <!-- GPS Button -->
    <button class="gps-btn" onclick="getGPSLocation()">
        🎯 Hozirgi joylashuvim bo'yicha xaritadan topish
    </button>

    <!-- Interactive Map (Xarita Oynasi) -->
    <div id="map"></div>

    <!-- Search Input -->
    <input type="text" class="search-box" placeholder="🔍 Qidirish (Kafe, AYOQSH, Mehmonxona...)">

    <!-- Categories -->
    <div class="categories-title">Kategoriyalar</div>
    <div class="categories">
        <div class="cat-card">🍽️ Restoran & Kafe</div>
        <div class="cat-card">🏨 Mehmonxonalar</div>
        <div class="cat-card">⛽ AYOQSH (Gaz/Benzin)</div>
        <div class="cat-card">✂️ Sartaroshxonalar</div>
        <div class="cat-card">🛠️ Avtoservislar</div>
        <div class="cat-card">🛍️ Do'konlar</div>
        <div class="cat-card cat-promo">🔥 Aksiyalar & Chegirmalar (30%-50%)</div>
    </div>

    <!-- Business Card Example -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">🍔 Oazis Fast Food</div>
            <div class="card-distance">350 metr</div>
        </div>
        <div class="card-info">
            📍 Yunusobod 4-mavze | ⭐ 4.9
        </div>
        <div class="card-actions">
            <button class="btn btn-loc" onclick="alert('Xaritada ko\'rsatilmoqda...')">📍 Xaritada ko'rish</button>
            <button class="btn btn-bot" onclick="alert('Menyu boti ochilmoqda...')">📖 Menyu Boti</button>
        </div>
    </div>

    <!-- Footer Links -->
    <div class="footer-links">
        <button class="footer-btn" onclick="alert('Bot Market Plus - barcha xizmatlar va botlar bozori.')">
            <span>ℹ️ Biz haqimizda</span> <span>›</span>
        </button>
        <button class="footer-btn" onclick="alert('Fikr-mulohaza va takliflar uchun kanalimizga xush kelibsiz!')">
            <span>💬 Fikr-mulohaza va Kanalimiz</span> <span>›</span>
        </button>
    </div>

    <!-- Bottom Tabs -->
    <div class="nav-tabs">
        <div class="tab active">📱 Joylar va Xizmatlar</div>
        <div class="tab" onclick="alert('Biznes ijarasi bo\'limi')">🚀 Bot Ijarasi ($1.5)</div>
    </div>

    <!-- Leaflet JS Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Xaritani ishga tushirish (Boshlang'ich markaz: Toshkent shahri)
        var map = L.map('map').setView([41.2995, 69.2401], 13);

        // OpenStreetMap qatlamini qo'shish
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Namuna uchun xaritaga yaqin atrofdagi joylar markerlarini qo'shish
        var markers = [
            { name: "Oazis Fast Food (Kafe)", lat: 41.3110, lon: 69.2405, desc: "350 metr - Fast food va menyu" },
            { name: "Grand Hotel (Mehmonxona)", lat: 41.3150, lon: 69.2500, desc: "1.1 km - 24/7 xizmat" },
            { name: "UNG Gaz Quyish Shoxobchasi (AYOQSH)", lat: 41.2900, lon: 69.2300, desc: "800 metr - Benzin va Metan" }
        ];

        markers.forEach(function(item) {
            L.marker([item.lat, item.lon]).addTo(map)
                .bindPopup("<b>" + item.name + "</b><br>" + item.desc);
        });

        // 2. GPS Joylashuvni aniqlash funksiyasi
        function getGPSLocation() {
            if (navigator.geolocation) {
                alert("GPS orqali turgan joyingiz aniqlanmoqda...");
                navigator.geolocation.getCurrentPosition(function(position) {
                    var userLat = position.coords.latitude;
                    var userLon = position.coords.longitude;
                    
                    // Xaritani foydalanuvchi turgan joyga surish va yaqinlashtirish
                    map.setView([userLat, userLon], 15);
                    
                    // Foydalanuvchi turgan joyga maxsus marker qo'yish
                    L.marker([userLat, userLon], {
                        title: "Sizning turgan joyingiz"
                    }).addTo(map)
                      .bindPopup("<b>Siz shu yerdasiz!</b><br>Atrofingizdagi eng yaqin joylar saralandi.")
                      .openPopup();
                      
                }, function(error) {
                    alert("GPS joylashuvni aniqlashda xatolik yuz berdi yoki ruxsat berilmadi.");
                });
            } else {
                alert("Brauzeringiz geolokatsiyani qo'llab-quvvatlamaydi.");
            }
        }
    </script>
</body>
          </html>
