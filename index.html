<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b2450">
<title>Bot Market Plus+ — Raqamli xizmatlar bozori</title>
<style>
:root{--navy:#0b2450;--navy2:#123a78;--blue:#1769ff;--blue2:#eaf2ff;--teal:#12b8a6;--green:#13a875;--ink:#14213d;--muted:#6b7892;--bg:#f4f7fc;--white:#fff;--line:#e5ebf4;--shadow:0 10px 28px rgba(17,48,94,.08);--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh;background:var(--bg)}
.topbar{background:linear-gradient(130deg,var(--navy),#123d7e);color:#fff;padding:17px 20px 20px;border-radius:0 0 26px 26px;box-shadow:0 10px 28px #0b245021}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:#ffffff1b;font-size:25px;border:1px solid #ffffff30}.brand-name{font-size:18px;font-weight:850;letter-spacing:-.4px}.brand-sub{font-size:11px;color:#d2e3ff;margin-top:2px}.top-actions{display:flex;align-items:center;gap:8px}.select-lang,.icon-btn{border:1px solid #ffffff42;background:#ffffff14;color:#fff;border-radius:12px;padding:9px 10px}.select-lang option{color:#122}.icon-btn{width:39px;height:39px;font-size:18px}.welcome{margin:21px 0 13px}.welcome h1{font-size:clamp(23px,4vw,32px);line-height:1.12;margin:0 0 8px;letter-spacing:-.8px}.welcome p{color:#d5e5ff;margin:0;font-size:13px;line-height:1.5;max-width:600px}.search{display:flex;align-items:center;gap:9px;background:#fff;border-radius:15px;padding:6px 8px 6px 13px;box-shadow:0 8px 22px #001c451c}.search span{font-size:19px;color:var(--muted)}.search input{border:0;outline:0;min-width:0;flex:1;padding:10px 0;color:var(--ink);background:transparent}.search button{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:11px 15px;font-weight:750}
main{padding:20px 18px 100px}.section{display:none;animation:appear .2s ease}.section.active{display:block}@keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:center;background:linear-gradient(120deg,#0e2b5c,#1769ff);border-radius:24px;padding:23px;color:#fff;overflow:hidden;position:relative;box-shadow:var(--shadow);margin-bottom:20px}.hero:after{content:"";position:absolute;width:210px;height:210px;right:-50px;top:-80px;border-radius:50%;border:32px solid #ffffff12}.hero h2{font-size:clamp(22px,4vw,30px);line-height:1.12;margin:0 0 10px;max-width:520px;letter-spacing:-.7px}.hero p{font-size:13px;line-height:1.55;color:#dceaff;margin:0 0 17px;max-width:480px}.hero-art{font-size:100px;text-align:center;filter:drop-shadow(0 12px 12px #001b5040);z-index:1}.primary-btn,.secondary-btn,.soft-btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary-btn{background:var(--blue);color:#fff;box-shadow:0 6px 14px #1769ff28}.hero .primary-btn{background:#fff;color:var(--navy)}.secondary-btn{background:var(--blue2);color:var(--blue)}.soft-btn{background:#f3f6fb;color:var(--ink);border:1px solid var(--line)}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:23px 2px 13px}.section-heading h2{margin:0;font-size:19px;letter-spacing:-.35px}.section-heading p{margin:5px 0 0;color:var(--muted);font-size:12px}.text-btn{border:0;background:transparent;color:var(--blue);font-weight:800;padding:8px 0}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.category{border:1px solid var(--line);background:#fff;border-radius:18px;padding:17px 10px;text-align:left;box-shadow:0 4px 14px #1c3b6507;transition:.18s;min-height:112px}.category:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.category .emoji{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;font-size:23px;margin-bottom:12px}.category strong{display:block;font-size:13px}.category small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.35}.c-blue .emoji{background:#e7f0ff}.c-green .emoji{background:#def8ee}.c-purple .emoji{background:#efe8ff}.c-orange .emoji{background:#fff0d9}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.bot-card,.info-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 15px #12335d08}.bot-visual{height:120px;display:grid;place-items:center;font-size:53px;background:linear-gradient(135deg,#e7f0ff,#f8fbff);position:relative}.bot-visual.green{background:linear-gradient(135deg,#d9f9ec,#f4fffa)}.bot-visual.purple{background:linear-gradient(135deg,#eee5ff,#fbf8ff)}.bot-visual.orange{background:linear-gradient(135deg,#fff0d9,#fffaf1)}.bot-visual.teal{background:linear-gradient(135deg,#d9fbfa,#f4ffff)}.badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;background:#fff;color:var(--navy);padding:5px 8px;border-radius:20px;border:1px solid #e3eaf5}.bot-body{padding:14px}.bot-title{font-size:14px;font-weight:850;margin:0 0 6px}.bot-desc{font-size:12px;line-height:1.45;color:var(--muted);min-height:36px;margin:0 0 10px}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:12px}.price{font-weight:850;color:var(--green)}.rating{color:#c47b00}.card-actions{display:flex;gap:8px}.card-actions button{flex:1;padding:10px 8px;font-size:12px}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1180px);display:flex;justify-content:space-around;gap:4px;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px 7px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -8px 22px #17375b0a}.nav-item{border:0;background:transparent;color:#8996aa;min-width:0;flex:1;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:750}.nav-item .nav-emoji{font-size:20px}.nav-item.active{color:var(--blue)}
.page-title{margin:2px 0 18px}.page-title h1{font-size:25px;margin:0 0 5px;letter-spacing:-.6px}.page-title p{color:var(--muted);font-size:13px;margin:0;line-height:1.5}.filter-row{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.filter-chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:30px;padding:9px 13px;font-size:12px;font-weight:750}.filter-chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.map-panel{background:#fff;padding:14px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.map-search{display:flex;gap:8px;margin-bottom:10px}.map-search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;outline-color:var(--blue)}#map{height:330px;border-radius:15px;overflow:hidden;background:#e5edf7}.map-hint{font-size:11px;color:var(--muted);line-height:1.5;margin:10px 2px 0}.business-list{display:grid;gap:10px;margin-top:14px}.business-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.business-icon{width:48px;height:48px;display:grid;place-items:center;background:#fff0d9;border-radius:13px;font-size:25px;flex-shrink:0}.business-row strong{font-size:13px}.business-row p{font-size:11px;color:var(--muted);margin:4px 0 0}.business-row button{margin-left:auto;border:0;background:#eff5ff;color:var(--blue);border-radius:10px;padding:9px}
.food-hero{border-radius:20px;min-height:175px;padding:20px;color:#fff;display:flex;align-items:end;background:linear-gradient(90deg,#09234fe8,#09234f12),url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=1000&auto=format&fit=crop&q=80') center/cover;margin-bottom:15px}.food-hero h2{margin:0 0 5px;font-size:25px}.food-hero p{margin:0;color:#e5edff;font-size:12px}.food-tabs{display:flex;gap:8px;margin-bottom:13px}.food-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 5px;font-size:12px;font-weight:800}.food-tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.food-list{display:grid;gap:10px}.food-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px}.food-img{width:66px;height:66px;border-radius:12px;background:#f6ead8;display:grid;place-items:center;font-size:32px;flex-shrink:0}.food-info{flex:1;min-width:0}.food-info strong{font-size:13px}.food-info p{font-size:11px;color:var(--muted);margin:4px 0}.food-price{font-weight:850;color:var(--navy);font-size:13px}.add-food{border:0;background:var(--blue);color:#fff;border-radius:50%;width:34px;height:34px;font-size:20px;font-weight:800}.cart-bar{position:sticky;bottom:72px;background:var(--blue);color:#fff;border-radius:15px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;font-weight:800;box-shadow:0 8px 20px #1769ff38}
.form-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);max-width:600px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;outline-color:var(--blue);background:#fff}.field textarea{resize:vertical}.form-card .primary-btn{width:100%}.note{background:#fff7df;border:1px solid #ffe8a3;color:#755400;border-radius:12px;padding:12px;font-size:12px;line-height:1.5;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:linear-gradient(130deg,var(--navy),#16468e);padding:17px;border-radius:18px;color:#fff;margin:16px 0}.stat{text-align:center;border-right:1px solid #ffffff28}.stat:last-child{border:0}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:#d2e2ff}.profile-row{display:flex;align-items:center;gap:13px;background:#fff;padding:16px;border:1px solid var(--line);border-radius:17px}.avatar{width:56px;height:56px;border-radius:50%;background:#e5efff;display:grid;place-items:center;font-size:30px}.profile-row p{margin:4px 0 0;font-size:12px;color:var(--muted)}.menu-list{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-top:13px}.menu-line{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px}.menu-line:last-child{border-bottom:0}.menu-line span:last-child{margin-left:auto;color:#93a0b4;font-size:19px}
.empty{background:#fff;border:1px dashed #cbd6e6;border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}.empty .emoji{font-size:38px;margin-bottom:8px}.toast{position:fixed;z-index:60;bottom:85px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#10264a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:90%;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{display:none;position:fixed;z-index:50;inset:0;background:#071a36a6;backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:22px;padding:21px;width:min(100%,440px);max-height:88vh;overflow:auto;box-shadow:0 20px 60px #061b3c45}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:#f1f4f9;border-radius:10px;width:35px;height:35px;font-size:22px;color:var(--muted)}.modal p{font-size:13px;color:var(--muted);line-height:1.55}.modal-actions{display:flex;gap:9px;margin-top:15px}.modal-actions>*{flex:1}
.footer-note{text-align:center;color:#8a97aa;font-size:11px;padding:18px 0 8px}
@media(min-width:800px){.topbar{padding:22px 28px 24px;border-radius:0 0 30px 30px}.welcome{margin-top:26px}.topbar,main{padding-left:28px;padding-right:28px}.hero{padding:30px}.hero-art{font-size:130px}.category{padding:20px}.bot-visual{height:145px}}
@media(max-width:650px){main{padding:15px 12px 100px}.topbar{padding:15px 14px 18px}.brand-name{font-size:16px}.brand-sub{font-size:10px}.brand-icon{width:39px;height:39px}.welcome{margin-top:18px}.hero{grid-template-columns:1fr .35fr;padding:18px;gap:5px}.hero-art{font-size:60px;align-self:center}.hero p{font-size:12px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.category{min-height:105px;padding:13px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bot-visual{height:100px;font-size:43px}.bot-body{padding:11px}.bot-desc{min-height:52px}.card-actions{flex-direction:column}.card-actions button{width:100%}.section-heading h2{font-size:17px}.map-search{flex-direction:column}.map-search .primary-btn{width:100%}.food-hero{min-height:155px}.food-hero h2{font-size:22px}}
@media(max-width:370px){.brand-name{font-size:14px}.select-lang{padding:8px 6px}.icon-btn{width:34px;height:34px}.cards{grid-template-columns:1fr}.bot-visual{height:115px}.hero-art{font-size:45px}.nav-item{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="topline">
    <div class="brand"><div class="brand-icon">🤖</div><div><div class="brand-name">Bot Market Plus+</div><div class="brand-sub" data-i18n="tagline">Barcha raqamli xizmatlar — bir joyda</div></div></div>
    <div class="top-actions">
      <select id="langSelect" class="select-lang" aria-label="Til"><option value="uz">UZ</option><option value="ru">RU</option></select>
      <button class="icon-btn" aria-label="Profil" onclick="navigate('profile')">👤</button>
    </div>
  </div>
  <div class="welcome"><h1 data-i18n="welcome">Biznesingizni avtomatlashtiring!</h1><p data-i18n="welcomeSub">Tayyor botlar, qulay xizmatlar va yangi imkoniyatlarni bir joydan toping.</p></div>
  <label class="search"><span>⌕</span><input id="globalSearch" data-placeholder="searchPlaceholder" placeholder="Bot, xizmat yoki shaharni qidiring..." autocomplete="off"><button onclick="runSearch()" data-i18n="search">Qidirish</button></label>
</header>
