
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">

    <title>Fast Food Express</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="brand">
        <div class="logo">🍔</div>
        <div>
            <h1>FAST FOOD</h1>
            <span>EXPRESS</span>
        </div>
    </div>

    <button class="icon-btn" id="profileBtn">👤</button>
</header>

<main>

    <!-- BOSH SAHIFA BANNER -->
    <section class="hero">
        <div class="hero-content">
            <span class="hero-label">MAZALI VA TEZKOR</span>
            <h2>Sevimli taomingiz<br>sizni kutmoqda!</h2>
            <p>Buyurtma bering, biz yetkazamiz.</p>
            <button class="yellow-btn" id="menuBtn">
                Menyuni ko‘rish
            </button>
        </div>
    </section>

    <!-- RESTORAN HOLATI -->
    <section class="restaurant-status">
        <span class="status-dot"></span>
        <span id="restaurantStatus">Buyurtmalar qabul qilinmoqda</span>
    </section>

    <!-- QIDIRUV -->
    <section class="search-section">
        <input
            type="search"
            id="searchInput"
            placeholder="Taom nomini qidiring..."
        >
    </section>

    <!-- KATEGORIYALAR -->
    <section class="section">
        <h2>Kategoriyalar</h2>

        <div class="categories" id="categories">
            <button class="category active" data-category="all">
                Barchasi
            </button>

            <button class="category" data-category="burger">
                🍔 Burger
            </button>

            <button class="category" data-category="lavash">
                🌯 Lavash
            </button>

            <button class="category" data-category="pizza">
                🍕 Pizza
            </button>

            <button class="category" data-category="drink">
                🥤 Ichimlik
            </button>
        </div>
    </section>

    <!-- MAHSULOTLAR -->
    <section class="section" id="menu">
        <div class="section-heading">
            <h2>Ommabop taomlar</h2>
            <span>Bizning menyu</span>
        </div>

        <div class="products" id="productsList">
            <p>Mahsulotlar yuklanmoqda...</p>
        </div>
    </section>

    <!-- BUYURTMA HOLATI -->
    <section class="section">
        <div class="delivery-info">
            <h3>🚚 Tezkor yetkazib berish</h3>
            <p>Buyurtmangiz holatini ilovada kuzatib boring.</p>
        </div>
    </section>

</main>

<!-- PASTKI MENYU -->
<nav class="bottom-nav">

    <button class="nav-item active" data-page="home">
        <span>⌂</span>
        <small>Bosh sahifa</small>
    </button>

    <button class="nav-item" data-page="menu">
        <span>☷</span>
        <small>Menyu</small>
    </button>

    <button class="nav-item" id="cartBtn">
        <span>🛒</span>
        <small>Savat</small>
        <b id="cartCount">0</b>
    </button>

    <button class="nav-item" id="ordersBtn">
        <span>📦</span>
        <small>Buyurtmalar</small>
    </button>

</nav>

<script src="app.js"></script>

</body>
</html>
